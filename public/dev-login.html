<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Unmaking - test login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="login-box">
    <h1>Test login</h1>
    <p class="error">
      Feide isn't connected yet (waiting on setup from the school). This
      page is only for testing the game engine, and only works when
      <code>ENABLE_DEV_LOGIN=true</code> is set on the server.
    </p>
    <form id="dev-login-form">
      <label for="testId">Choose a test user id</label>
      <input id="testId" name="testId" placeholder="e.g. student1" required />
      <button type="submit" class="choice-btn">Log in (test)</button>
    </form>
    <p id="dev-login-error" class="error" hidden></p>
  </main>
  <script type="module">
    import { devLogin } from '/js/api.js';
    const form = document.getElementById('dev-login-form');
    const errorEl = document.getElementById('dev-login-error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      try {
        await devLogin(document.getElementById('testId').value);
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
