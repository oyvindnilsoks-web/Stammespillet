<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="340" fill="#2a2319"/>
  <rect x="0" y="0" width="800" height="340" fill="none" stroke="#c98f3e" stroke-width="2" stroke-opacity="0.4"/>

  <!-- water horizon -->
  <rect x="0" y="230" width="800" height="110" fill="#c98f3e" fill-opacity="0.08"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="#c98f3e" stroke-opacity="0.4"/>

  <!-- boat silhouette -->
  <g transform="translate(320,190)">
    <path d="M0,40 L100,40 L85,60 L15,60 Z" fill="#c98f3e" fill-opacity="0.6"/>
    <line x1="50" y1="0" x2="50" y2="40" stroke="#c98f3e" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M50,4 L50,34 L82,34 Z" fill="#c98f3e" fill-opacity="0.4"/>
  </g>

  <!-- song waves rippling outward -->
  <g stroke="#f2e9da" stroke-opacity="0.25" fill="none">
    <circle cx="370" cy="230" r="40"/>
    <circle cx="370" cy="230" r="80"/>
    <circle cx="370" cy="230" r="130"/>
  </g>

  <!-- moon / distant light -->
  <circle cx="680" cy="70" r="30" fill="#f2e9da" fill-opacity="0.15"/>

  <text x="400" y="290" text-anchor="middle" fill="#b8a98e" font-family="Georgia, serif" font-size="18" font-style="italic">
    Placeholder-illustrasjon – The Long Song
  </text>
</svg>
